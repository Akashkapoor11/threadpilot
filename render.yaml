services:
  - type: web
    name: threadpilot-as01
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: threadpilot-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production
      - key: SEED_DEMO
        value: "true"
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: PORT
        value: "8080"
      # Add these in Render only when using an external OpenAI-compatible provider.
      - key: LLM_API_KEY
        sync: false

databases:
  - name: threadpilot-db
    plan: free
    postgresMajorVersion: "16"
